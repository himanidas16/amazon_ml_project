[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-er"
version = "0.1.0"
description = "Business Entity Resolution pipeline for the Amazon ML Challenge 2026"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

# Makes `pytest` work from this directory without installing the package:
# it puts src/ on sys.path so `import business_er` resolves.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
